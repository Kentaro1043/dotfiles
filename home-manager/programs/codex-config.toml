model = "gpt-5.6-sol"
model_reasoning_effort = "low"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
cli_auth_credentials_store = "file"
default_permissions = "local-workspace"
web_search = "live"

[features]
worktrees = true

[mcp_servers.grafana-cloud]
url = "https://mcp.grafana.com/mcp"
auth = "oauth"
http_headers = { "X-Grafana-URL" = "https://kentaro1043.grafana.net" }

[mcp_servers.grafana-trap-sakura]
url = "https://s-grafana-mcp.trap.jp/mcp"
env_http_headers = { "Authorization" = "GRAFANA_MCP_TRAP_AUTHORIZATION" }

[mcp_servers.grafana-trap-conoha]
url = "https://grafana-mcp.trap.jp/mcp"
env_http_headers = { "Authorization" = "GRAFANA_MCP_TRAP_AUTHORIZATION" }

[mcp_servers.grafana-work]
command = "@grafanaWorkCommand@"
startup_timeout_sec = 60

[mcp_servers.science-tokyo-syllabus]
url = "https://syllabus.s.isct.ac.jp/mcp"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[permissions.local-workspace]
description = "Workspace access plus common local tool caches."
extends = ":workspace"

[permissions.local-workspace.filesystem]
"/nix/store" = "read"
"~/.cache/nix" = "write"
"~/.cache/uv" = "write"
"~/.codex/skills" = "read"
"~/.codex-work/skills" = "read"
"~/.local/share/uv" = "write"
"~/.local/state/uv" = "write"
"~/.ssh/conf.d" = "read"
"~/.ssh/config" = "read"
":slash_tmp" = "write"
":tmpdir" = "write"
"/private/tmp" = "write"
"/private/var/folders" = "write"
"/var/folders" = "write"

[permissions.local-workspace.network]
enabled = true

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "auto"
notification_condition = "unfocused"
status_line = [
    "model-with-reasoning",
    "context-remaining",
    "project-root",
    "git-branch",
    "pull-request-number",
    "five-hour-limit",
    "weekly-limit",
]
